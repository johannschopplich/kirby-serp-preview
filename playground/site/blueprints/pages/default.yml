title: Page

columns:
  - width: 2/3
    fields:
      metaDescription:
        label: Meta Description
        type: textarea
        buttons: false
        size: small

  - width: 1/3
    sections:
      serp-preview:
        type: serp-preview
        siteTitle: "{{ site.title }}"
        siteUrl: "{{ site.url }}"
        faviconUrl: https://kirby.tools/favicon.ico
        descriptionContentKey: metaDescription
        searchConsoleUrl: https://search.google.com/search-console
