name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm run test:types
      - run: pnpm run lint
      - run: pnpm exec prettier --check "src/panel/**"
